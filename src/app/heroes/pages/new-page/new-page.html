<h1>
    {{ currentHero.id ? 'Editar' : 'Añadir'}}
    héroe
    @if( currentHero.id ){
      <small>{{ currentHero.superhero }}</small>
    }
</h1>

<mat-divider class="mb-2"></mat-divider>

<div class="grid">
    <div class="col-12 sm:col-6">
        <mat-card>
            <mat-card-content>
                <form class="grid" [formGroup]="heroForm">

                    <mat-form-field class="col-12 sm:col-6">
                        <mat-label>Super héroe</mat-label>
                        <input type="text" matInput required formControlName="superhero"/>
                    </mat-form-field>

                    <mat-form-field class="col-12 sm:col-6">
                        <mat-label>Alter ego</mat-label>
                        <input type="text" matInput required formControlName="alter_ego"/>
                    </mat-form-field>

                    <mat-form-field class="col-12">
                        <mat-label>Primera aparición</mat-label>
                        <input type="text" matInput required formControlName="first_appearance"/>
                    </mat-form-field>

                    <mat-form-field class="col-12">
                        <mat-label>Personajes</mat-label>
                        <input type="text" matInput required formControlName="characters"/>
                    </mat-form-field>

                    <mat-form-field class="col-12">
                        <mat-label>Creador</mat-label>
                        <mat-select required formControlName="publisher">
                            @for (pub of publishers; track $index) {
                                <mat-option value="{{ pub.id }}">
                                    {{ pub.desc }}
                                </mat-option>
                            }
                        </mat-select>
                    </mat-form-field>

                    <mat-form-field class="col-12">
                        <mat-label>Imagen alternativa</mat-label>
                        <input type="text" matInput formControlName="alt_img"/>
                    </mat-form-field>

                </form>

                <div class="flex justify-content-between">
                  @if(currentHero.id){
                    <button matButton="elevated" color="warn" (click)="onDeleteHero()">Borrar</button>
                  }
                  <button matButton="filled" color="primary" [disabled]="!heroForm.valid" (click)="onSubmit()">Guardar</button>
                </div>

            </mat-card-content>
        </mat-card>
    </div>

    <div class="col-12 sm:col-6">
        <mat-card>
            <img [src]="currentHero | heroImage" alt="Imágen del Héroe" mat-card-image>
        </mat-card>
    </div>

    <pre>
      {{ currentHero | json }}
    </pre>

</div>
