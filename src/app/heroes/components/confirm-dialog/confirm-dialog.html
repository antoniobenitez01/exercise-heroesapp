<h1 mat-dialog-title>¿Está seguro?</h1>
<div mat-dialog-content>
  <p>Este proceso no es reversible. Si continúa eliminará a {{ data.superhero }}</p>
</div>
<div mat-dialog-actions>
  <button matButton="elevated" color="warn" (click)="onNoClick()">No Thanks</button>
  <span class="spacer"></span>
  <button matButton="filled" color="primary" (click)="onConfirm()">OK</button>
</div>
